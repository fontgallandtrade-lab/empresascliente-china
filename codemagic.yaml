workflows:
  android-release:
    name: ChinaFast Cliente Android

    max_build_duration: 60

    environment:
      node: 22
      java: 17

    scripts:
      - name: Instalar dependências
        script: |
          npm ci

      - name: Verificar TypeScript
        script: |
          npx tsc --noEmit

      - name: Verificar Expo
        script: |
          npx expo-doctor

      - name: Gerar projeto Android
        script: |
          EXPO_NO_GIT_STATUS=1 npx expo prebuild --platform android --clean --no-install

      - name: Gerar APK release
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Localizar APK
        script: |
          find android/app/build/outputs -type f -name "*.apk" -print

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
