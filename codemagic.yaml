workflows:
  chinafast-android-apk:
    name: ChinaFast Android APK
    max_build_duration: 60

    environment:
      node: 20
      java: 17
      vars:
        NODE_ENV: production
        EXPO_NO_TELEMETRY: "1"

    scripts:
      - name: Instalar dependências
        script: |
          npm ci

      - name: Verificar TypeScript
        script: |
          npx tsc --noEmit

      - name: Gerar projeto Android
        script: |
          npx expo prebuild \
            --platform android \
            --clean \
            --no-install \
            --non-interactive

      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Limpar build Android
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean

      - name: Gerar APK Release
        script: |
          cd android
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/**
