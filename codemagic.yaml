workflows:
  android-apk:
    name: ChinaFast Android APK
    max_build_duration: 60

    environment:
      node: 22
      java: 17

    scripts:
      - name: Instalar dependências
        script: |
          npm ci

      - name: Verificar projeto Expo
        script: |
          npx expo-doctor

      - name: Gerar projeto Android
        script: |
          npx expo prebuild --platform android --non-interactive --clean

      - name: Gerar APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
